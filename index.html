<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Abi 💜</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Background ── */
    body {
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ffd6ec 0%, #e8d5ff 40%, #c5f0e4 100%);
      background-size: 400% 400%;
      animation: bgShift 14s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    @keyframes bgShift {
      0%   { background-position: 0%   50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0%   50%; }
    }

    /* ── Ambient blobs ── */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      animation: blobDrift 18s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 { width: 480px; height: 480px; background: #f9a8d4; top: -140px; left: -140px; animation-delay: 0s; }
    .blob-2 { width: 400px; height: 400px; background: #c4b5fd; bottom: -120px; right: -120px; animation-delay: -6s; }
    .blob-3 { width: 300px; height: 300px; background: #6ee7b7; bottom: 10%; left: 5%; animation-delay: -12s; }

    @keyframes blobDrift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.08); }
    }

    /* ── Glass Card ── */
    .card {
      position: relative;
      z-index: 2;
      width: min(92vw, 400px);
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1.5px solid rgba(255, 255, 255, 0.75);
      border-radius: 32px;
      padding: 36px 32px 30px;
      text-align: center;
      box-shadow:
        0 8px 32px rgba(196, 181, 253, 0.35),
        0 2px 8px rgba(249, 168, 212, 0.2),
        inset 0 1px 0 rgba(255,255,255,0.8);
      animation: cardEntrance 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes cardEntrance {
      from { opacity: 0; transform: translateY(40px) scale(0.94); }
      to   { opacity: 1; transform: translateY(0)   scale(1);    }
    }

    /* ── Avatar ── */
    .avatar-ring {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f9a8d4, #c4b5fd, #6ee7b7);
      padding: 3px;
      margin: 0 auto 18px;
      animation: ringRotate 6s linear infinite;
    }

    @keyframes ringRotate {
      to { filter: hue-rotate(360deg); }
    }

    .avatar-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid white;
      display: block;
    }

    /* ── Title ── */
    h1 {
      font-size: 1.7rem;
      font-weight: 700;
      background: linear-gradient(120deg, #ec4899, #8b5cf6, #10b981);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: titleShimmer 4s linear infinite;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }

    @keyframes titleShimmer {
      to { background-position: 200% center; }
    }

    .subtitle {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #a78bfa;
      margin-bottom: 22px;
    }

    /* ── Message bubble ── */
    .message-wrap {
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
    }

    #message {
      font-size: 0.95rem;
      font-weight: 400;
      color: #4c1d95;
      line-height: 1.7;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 18px;
      border: 1px solid rgba(196, 181, 253, 0.4);
      box-shadow: 0 2px 12px rgba(196, 181, 253, 0.2);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    #message.fade-out {
      opacity: 0;
      transform: translateY(6px);
    }

    /* ── Progress dots ── */
    .progress-bar {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(139, 92, 246, 0.25);
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .dot.active {
      background: #8b5cf6;
      transform: scale(1.4);
    }

    /* ── Button ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      background: linear-gradient(135deg, #f472b6, #8b5cf6);
      border: none;
      border-radius: 999px;
      color: white;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.25), transparent);
      border-radius: inherit;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 8px 28px rgba(139, 92, 246, 0.55);
    }

    .btn:active {
      transform: scale(0.97);
    }

    /* ── Counter ── */
    .counter {
      margin-top: 14px;
      font-size: 0.7rem;
      font-weight: 500;
      color: #a78bfa;
      letter-spacing: 1px;
    }

    /* ── Floating particles ── */
    .particle {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      animation: floatUp linear forwards;
      user-select: none;
    }

    @keyframes floatUp {
      0%   { transform: translateY(0)   rotate(0deg);   opacity: 0.9; }
      100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; }
    }

    /* ── Sparkle decoration ── */
    .sparkle {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      animation: sparkleAnim 2.5s ease-out forwards;
    }

    @keyframes sparkleAnim {
      0%   { transform: scale(0);   opacity: 1; }
      50%  { transform: scale(1.5); opacity: 0.8; }
      100% { transform: scale(0);   opacity: 0; }
    }
  </style>
</head>

<body>

  <!-- Ambient background blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <!-- Main card -->
  <div class="card">

    <div class="avatar-ring">
      <img src="images/3.jpg.jpg" alt="Abi">
    </div>

    <h1>Abi 💜</h1>
    <p class="subtitle">Always &amp; Forever</p>

    <div class="message-wrap">
      <p id="message"></p>
    </div>

    <div class="progress-bar" id="progressBar"></div>

    <button class="btn" onclick="nextMessage()">
      Tap 🫶
    </button>

    <p class="counter" id="counter"></p>

  </div>

  <script>
    const messages = [
      "My love, I'm sorry you're not feeling good today.",
      "I don't like seeing you like that, I want you to be always happy and in a good mood.",
      "Is it hard to deal with me?",
      "I'm sorry, that's not a good thing to ask.",
      "I love you so much and I don't wanna loose you because of my stupid problems.",
      "And I really don't ever wanna see you sad, I only want you to be happy forever.",
      "Always together.",
      "I feel like I'm just causing you to be in a bad mood at this point but...",
      "I never knew what true love was before I met you.",
      "Am I yapping too much?",
      "I love you so much and loving you made me see how deeply I love you and maybe even seem crazy to you...",
      "I don't know why I'm like that.",
      "But I want me and you to be always and forever together.",
      "Do I seem a bit crazy?",
      "I love you so deeply, I want you to be with me forever, forever be mine and forever belong to me",
      "I want you to be all mine. I wanna own you, your soul, your body is mine.",
      "That can sound crazy... But I think you like it.",
      "We promised we would be always and forever together. Forever happy with each other.",
      "I want you to feel better my love so let's read the sweet things we've said to each other.",
      "I want us to forever be happy with each other.",
      "My love for you is like the raging sea so powerful and deep it will forever be.",
      "I promise you that I will do everything to always keep you with me.",
      "Through storm, wind and heavy rain, it will withstand every pain.",
      "I want to make you the happiest girl in the universe.",
      "What I feel for you is something special, something I've never felt before and it grows stronger every day.",
      "You gave my life a purpose.",
      "Mon amour est si grand qu'aucun mots ne serait dans la capacité de le décrire proprement.",
      "It felt like two souls that were bound for each other, finally found each other.",
      "I will always be by your side, even after death.",
      "I'll always choose to be with you.",
      "If only you could see through my eyes how perfect you are.",
      "Before I met you, I couldn't understand the meaning of life.",
      "Fuck me.",
      "I'm jerking off.",
      "My belly hurts.",
      "Chemo siyvarulo dzaan mikvarkhar, Je t'aime beacoup.",
      "Always and forever together."
    ];

    let currentIndex = 0;
    const msgEl  = document.getElementById("message");
    const counter = document.getElementById("counter");
    const bar     = document.getElementById("progressBar");

    /* Build progress dots */
    messages.forEach((_, i) => {
      const d = document.createElement("div");
      d.className = "dot" + (i === 0 ? " active" : "");
      d.id = "dot-" + i;
      bar.appendChild(d);
    });

    function updateUI() {
      counter.textContent = (currentIndex + 1) + " / " + messages.length;
      document.querySelectorAll(".dot").forEach((d, i) => {
        d.classList.toggle("active", i === currentIndex);
      });
    }

    msgEl.textContent = messages[0];
    updateUI();

    function nextMessage() {
      msgEl.classList.add("fade-out");
      setTimeout(() => {
        currentIndex = (currentIndex + 1) % messages.length;
        msgEl.textContent = messages[currentIndex];
        msgEl.classList.remove("fade-out");
        updateUI();
      }, 350);
      spawnSparkles();
    }

    /* ── Floating particles ── */
    const emojis = ["💜", "🌸", "✨", "💖", "🌿", "💫", "🦋", "🌷"];

    setInterval(() => {
      const p = document.createElement("div");
      p.className = "particle";
      p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      p.style.left     = Math.random() * 100 + "vw";
      p.style.bottom   = "-40px";
      p.style.fontSize = (Math.random() * 12 + 14) + "px";
      p.style.animationDuration = (Math.random() * 5 + 5) + "s";
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 10500);
    }, 800);

    /* ── Sparkles on button click ── */
    function spawnSparkles() {
      const btn  = document.querySelector(".btn");
      const rect = btn.getBoundingClientRect();
      const colors = ["#f472b6", "#8b5cf6", "#34d399", "#fbbf24"];
      for (let i = 0; i < 8; i++) {
        const s = document.createElement("div");
        s.className = "sparkle";
        s.style.background = colors[Math.floor(Math.random() * colors.length)];
        s.style.left = (rect.left + rect.width  / 2 + (Math.random() - 0.5) * 80) + "px";
        s.style.top  = (rect.top  + rect.height / 2 + (Math.random() - 0.5) * 40) + "px";
        s.style.animationDuration = (Math.random() * 1 + 1) + "s";
        s.style.animationDelay   = (Math.random() * 0.3) + "s";
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 2600);
      }
    }
  </script>

</body>
</html>
